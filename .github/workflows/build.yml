name: Build InstaZen

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Download ReVanced Tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir revanced
          cd revanced
          
          # Safely download latest assets using the official authenticated GitHub CLI
          gh release download -R revanced/revanced-cli -p "*.jar"
          gh release download -R revanced/revanced-patches -p "*.rvp"
          gh release download -R revanced/revanced-integrations -p "*.apk"
          
          # Rename them to standard names
          mv revanced-cli*.jar revanced-cli.jar
          mv *.rvp revanced-patches.rvp
          mv *.apk revanced-integrations.apk

      - name: Download apkeep (APK Fetcher)
        run: |
          wget https://github.com/EFForg/apkeep/releases/download/0.18.0/apkeep-x86_64-unknown-linux-gnu -O apkeep
          chmod +x apkeep

      - name: Download Latest Instagram APK
        run: |
          ./apkeep -a com.instagram.android -d apk-pure .
          mv com.instagram.android* instagram.apk

      - name: Patch APK with ReVanced
        run: |
          java -jar revanced/revanced-cli.jar patch \
            -p revanced/revanced-patches.rvp -b \
            -o instazen-unsigned.apk \
            instagram.apk

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > instazen.keystore

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks instazen.keystore \
            --ks-key-alias ${{ secrets.KEYALIAS }} \
            --ks-pass pass:${{ secrets.KEYPASSWORD }} \
            --out InstaZen-Release.apk \
            instazen-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: InstaZen Build ${{ github.run_number }}
          files: InstaZen-Release.apk
          draft: false
          prerelease: false