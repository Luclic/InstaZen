name: Build InstaZen

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Download ReVanced Tooling (Bulletproof)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir revanced
          cd revanced
          
          # 1. Download RVX CLI (Must use arsclib fork for RVX compatibility)
          gh release download -R inotia00/revanced-cli-arsclib -p "*.jar"
          
          # 2. Download RVX Patches
          gh release download -R inotia00/revanced-patches -p "*.jar" || gh release download -R inotia00/revanced-patches -p "*.rvp"
          
          # 3. Download RVX Integrations (Safe fallback)
          gh release download -R inotia00/revanced-integrations -p "*.apk" || echo "No integrations found, skipping."
          
          # Safely rename everything
          find . -name "*cli*.jar" -exec mv {} revanced-cli.jar \;
          find . -name "*patches*.jar" -exec mv {} revanced-patches.jar \;
          find . -name "*patches*.rvp" -exec mv {} revanced-patches.rvp \;
          find . -name "*integrations*.apk" -exec mv {} revanced-integrations.apk \;

      - name: Download apkeep (APK Fetcher)
        run: |
          wget https://github.com/EFForg/apkeep/releases/download/0.18.0/apkeep-x86_64-unknown-linux-gnu -O apkeep
          chmod +x apkeep

      - name: Download Latest Instagram APK
        run: |
          ./apkeep -a com.instagram.android -d apk-pure .
          # Safely rename the file while keeping its original extension (.apk or .xapk)
          FILE=$(ls com.instagram.android*)
          mv "$FILE" instagram.${FILE##*.}

      - name: Patch APK with ReVanced Extended
        run: |
          PATCH_FILE=$(find revanced -name "revanced-patches.*" | head -n 1)
          INT_FILE=$(find revanced -name "revanced-integrations.apk" | head -n 1)
          
          ARGS="-b $PATCH_FILE"
          if [ -n "$INT_FILE" ]; then
            ARGS="$ARGS -m $INT_FILE"
          fi
          
          # Use old CLI syntax: no 'patch' keyword, -a for apk, --experimental for force
          java -jar revanced/revanced-cli.jar $ARGS --experimental -o instazen-unsigned.apk -a instagram.*
            
          # Safety check: fail cleanly if the file was skipped again
          if [ ! -f "instazen-unsigned.apk" ]; then
            echo "Error: Patched APK was not created! The patcher applied zero patches."
            exit 1
          fi

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > instazen.keystore

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks instazen.keystore \
            --ks-key-alias ${{ secrets.KEYALIAS }} \
            --ks-pass pass:${{ secrets.KEYPASSWORD }} \
            --out InstaZen-Release.apk \
            instazen-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: InstaZen Build ${{ github.run_number }}
          files: InstaZen-Release.apk
          draft: false
          prerelease: false